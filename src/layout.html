<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<meta name="robots" content="{{page.robots}}">
<meta name="theme-color" content="#0F1019">
<link rel="canonical" href="{{page.canonical}}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site.name}}">
<meta property="og:locale" content="{{site.locale}}">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{page.canonical}}">
<meta property="og:image" content="{{page.ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{page.ogImageAlt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{page.title}}">
<meta name="twitter:description" content="{{page.description}}">
<meta name="twitter:image" content="{{page.ogImage}}">

<link rel="icon" href="{{root}}favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="{{root}}favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="{{root}}apple-touch-icon.png">

{{> fonts}}
<script>document.documentElement.classList.add('js')</script>
<link rel="stylesheet" href="{{root}}css/styles.css?v={{ver.css}}">
<script type="application/ld+json">{{page.jsonld}}</script>
<script src="{{root}}js/site.js?v={{ver.js}}" defer></script>
</head>
<body id="top">
<a class="skip" href="#contenido">Saltar al contenido</a>
{{> header}}
<main id="contenido">
{{content}}
</main>
{{> snav}}
{{> footer}}
</body>
</html>
